<?xml version="1.0" encoding="UTF-8"?>
<!--
  harbour-pipecam app icon.

  SILHOUETTE
  The Sailfish app-icon shape, taken from harbour-sflipper so the family stays
  visually consistent: one sharp corner (top-left) and three corners rounded at
  R=86 (= half the side), which makes them merge into a near-circle.

  MOTIF — "looking down a pipe"
  A camera lens seen at the far end of a tube. The tube is drawn as concentric
  rings around a common centre. Two things sell the 3D:
    1. the radii shrink towards the centre, and
    2. the GAP between consecutive rings shrinks with them, because in linear
       perspective equally-spaced physical rings appear to bunch up as they
       recede. Rings with constant spacing read as flat circles, not a tunnel.
  Stroke width and brightness fall off inward for the same reason: the far end
  of a pipe is dimmer and thinner. The rings are warm amber, as if lit by the
  camera's own ring light — which is exactly what the real hardware does.

  The lens sits at the end of that tunnel in cool teal, complementary to the
  amber so it reads as a separate object rather than another ring: a dark glass
  body, a bright iris, and a single specular highlight at the upper left.

  Sizes are generated by scripts/make-icons.sh (86/108/128/172 for harbour,
  plus the zoomed cover tile from icon-cover.svg).

  Copyright (C) 2026  JimKnopfIoT - GPLv3 or later.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <defs>
    <!-- Cold steel tile: reads as "industrial / inspection tool". -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4F5C"/>
      <stop offset="1" stop-color="#141F26"/>
    </linearGradient>

    <!-- Depth wash: darkens the middle so the tunnel recedes into shadow. -->
    <radialGradient id="depth" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0"    stop-color="#000000" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Lens glass: bright iris centre falling off to a dark rim. -->
    <radialGradient id="glass" cx="0.38" cy="0.34" r="0.78">
      <stop offset="0"    stop-color="#7FF3FF"/>
      <stop offset="0.35" stop-color="#2BC4D8"/>
      <stop offset="0.75" stop-color="#12626F"/>
      <stop offset="1"    stop-color="#08313A"/>
    </radialGradient>

    <clipPath id="tileClip">
      <path d="M0,0 L86,0 A86,86 0 0 1 172,86 A86,86 0 0 1 86,172 A86,86 0 0 1 0,86 Z"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <path fill="url(#tile)" d="M0,0 L86,0 A86,86 0 0 1 172,86 A86,86 0 0 1 86,172 A86,86 0 0 1 0,86 Z"/>

  <!-- Everything below is clipped to the tile so the widest ring can bleed to
       the edge without breaking the silhouette. -->
  <g clip-path="url(#tileClip)">

    <!-- Pipe rings. Centre (86,88), pushed 2px low so the icon sits optically
         centred once the sharp top-left corner is taken into account.
         radius : 76   62   50   40.5  33      gaps 14  12  9.5  7.5
         width  :  9    7.5  6     4.8  3.8
         colour : bright amber -> dim brown, i.e. front -> far. -->
    <g fill="none" stroke-linecap="round">
      <circle cx="86" cy="88" r="76"   stroke="#FFC061" stroke-width="9"/>
      <circle cx="86" cy="88" r="62"   stroke="#F2A03F" stroke-width="7.5"/>
      <circle cx="86" cy="88" r="50"   stroke="#CE7C2C" stroke-width="6"/>
      <circle cx="86" cy="88" r="40.5" stroke="#9C5C24" stroke-width="4.8"/>
      <circle cx="86" cy="88" r="33"   stroke="#6E421D" stroke-width="3.8"/>
    </g>

    <!-- Shadow wash over the rings, strongest at the centre. -->
    <circle cx="86" cy="88" r="86" fill="url(#depth)"/>

    <!-- Lens barrel: a dark seat that separates the glass from the last ring. -->
    <circle cx="86" cy="88" r="27" fill="#0A1318"/>

    <!-- Glass -->
    <circle cx="86" cy="88" r="23" fill="url(#glass)"/>

    <!-- Iris ring, just enough to read as a lens rather than a plain dot. -->
    <circle cx="86" cy="88" r="13.5" fill="none" stroke="#062A33" stroke-width="3" opacity="0.85"/>

    <!-- Specular highlight, upper left, matching the glass gradient's hot spot. -->
    <ellipse cx="77" cy="79" rx="8.5" ry="6" fill="#FFFFFF" opacity="0.72"
             transform="rotate(-38 77 79)"/>
  </g>
</svg>
